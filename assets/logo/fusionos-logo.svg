<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)">
    <!-- Outer Hex Shield -->
    <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" fill="url(#primaryGrad)" opacity="0.15" />
    <polygon points="50,5 90,27 90,73 50,95 10,73 10,27" fill="none" stroke="url(#primaryGrad)" stroke-width="4" filter="url(#glow)" />
    
    <!-- Inner Fusion Node Mesh -->
    <circle cx="50" cy="50" r="14" fill="url(#accentGrad)" />
    <circle cx="50" cy="24" r="6" fill="#6366F1" />
    <circle cx="72" cy="63" r="6" fill="#8B5CF6" />
    <circle cx="28" cy="63" r="6" fill="#06B6D4" />
    
    <!-- Connection Vectors -->
    <line x1="50" y1="36" x2="50" y2="24" stroke="#818CF8" stroke-width="3" />
    <line x1="62" y1="57" x2="72" y2="63" stroke="#818CF8" stroke-width="3" />
    <line x1="38" y1="57" x2="28" y2="63" stroke="#818CF8" stroke-width="3" />
  </g>

  <!-- Wordmark Text -->
  <text x="125" y="68" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" letter-spacing="-0.5">Fusion<tspan fill="url(#primaryGrad)">OS</tspan></text>
  <text x="127" y="93" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#94A3B8" letter-spacing="3.5">ENTERPRISE ERP PLATFORM</text>
</svg>
