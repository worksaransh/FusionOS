# FusionOS on-prem deployment stack (Phase 1.2, roadmap item).
#
# This is a trimmed alternative to the root docker-compose.yml, aimed at a
# customer's own IT team standing up FusionOS on their own hardware/VM without
# needing to also run Kafka or the observability stack (Prometheus/Grafana/
# Loki/OTel) just to boot the app.
#
# Why this is safe to trim: confirmed this session by reading
# backend/src/Host/FusionOS.Api.Host/Program.cs and
# backend/src/BuildingBlocks/FusionOS.BuildingBlocks.EventBus (KafkaEventBus /
# KafkaConsumerHostedService) — when Kafka is unreachable, the event bus's
# connection attempts retry and fail silently (logged, not thrown), REST APIs
# keep serving requests normally, and each module's OutboxDispatcher
# background service just logs a warning and keeps polling on its normal
# interval, ready to actually publish the moment a broker becomes reachable.
# Nothing in the request path blocks on Kafka being up. The same is true of
# the OTLP/Loki exporters (see Program.cs — both are no-ops when their
# endpoint config is blank, which is the default here).
#
# What this file intentionally does NOT re-invent: the `web` service already
# ships an nginx reverse proxy (frontend/nginx.conf) that serves the built SPA
# AND proxies `/api/` to the `api` container on the same origin/port — that
# already *is* the single ingress point a customer's IT team needs to expose
# (80, or 443 once they terminate TLS in front of it). A second, separate
# "reverse-proxy" container in front of that would just be a redundant hop, so
# this file does not add one; `web` is the on-prem entry point.
#
# Usage:
#   # Minimal on-prem footprint — Postgres + API + frontend/proxy only:
#   docker compose -f docker-compose.onprem.yml up -d
#
#   # Opt in to Kafka (cross-module integration events flowing immediately
#   # instead of only once the outbox catches up on a later reachable broker):
#   docker compose -f docker-compose.onprem.yml --profile kafka up -d
#
#   # Opt in to the observability stack (Prometheus/Grafana/Loki/OTel):
#   docker compose -f docker-compose.onprem.yml --profile observability up -d
#
#   # Both:
#   docker compose -f docker-compose.onprem.yml --profile kafka --profile observability up -d
#
# Before first boot: apply EF Core migrations as an explicit release step —
# this file deliberately does NOT set ASPNETCORE_ENVIRONMENT=Development, so
# the app's own dev-only migration bootstrap in Program.cs will NOT run here.
# See docs/deployment/ONPREM_RUNBOOK.md for the exact `dotnet ef database
# update` commands, one per module DbContext.
#
# Secrets: ConnectionStrings__Postgres and Jwt__SigningKey below are
# placeholders for local testing of this file only. A real deployment MUST
# override both (env file, orchestrator secret, etc.) with real values —
# Program.cs fails fast at startup outside Development if either is missing,
# and the placeholder Jwt__SigningKey here is not a real secret. See
# docs/deployment/ONPREM_RUNBOOK.md §"Secrets and environment configuration".

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fusionos
      POSTGRES_USER: fusionos
      POSTGRES_PASSWORD: fusionos
    ports:
      - "5432:5432"
    volumes:
      - fusionos_onprem_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusionos -d fusionos"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      # CHANGE these for a real deployment — see the "Secrets" note above and
      # docs/deployment/ONPREM_RUNBOOK.md.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fusionos;Username=fusionos;Password=fusionos"
      Jwt__SigningKey: "REPLACE-ME-with-a-real-secret-before-any-non-local-deploy"
      # Left pointed at the "kafka" hostname on purpose: if the kafka profile
      # isn't enabled there's simply no such host, the event bus's connection
      # retries fail silently, and the app runs fine anyway (see header
      # comment). Point this at a real broker if/when the kafka profile (or
      # an external Kafka) is in use.
      Kafka__BootstrapServers: "kafka:9092"
      # Deliberately NOT "Development" — see the migrations note above.
      ASPNETCORE_ENVIRONMENT: "Production"
      # Blank by default = observability exporters are no-ops (see header
      # comment). Set these only if the observability profile is enabled.
      Observability__OtlpEndpoint: ""
      Observability__LokiUrl: ""
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  # --- Opt-in: Kafka (cross-module integration events) -----------------------
  # docker compose -f docker-compose.onprem.yml --profile kafka up -d
  kafka:
    image: apache/kafka:3.7.0
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "fusionos-onprem-cluster-id-000001"
    restart: unless-stopped

  # --- Opt-in: observability stack (Prometheus/Grafana/Loki/OTel) ------------
  # docker compose -f docker-compose.onprem.yml --profile observability up -d
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    profiles: ["observability"]
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fusionos_onprem_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.8
    profiles: ["observability"]
    ports:
      - "3100:3100"
    volumes:
      - fusionos_onprem_loki_data:/loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - fusionos_onprem_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  fusionos_onprem_postgres_data:
  fusionos_onprem_prometheus_data:
  fusionos_onprem_loki_data:
  fusionos_onprem_grafana_data:
